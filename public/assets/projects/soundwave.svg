<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="SoundWave Web Audio Reactive 3D Visualizer">
  <rect width="960" height="540" fill="#090a10"/>
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Radar Rings -->
  <circle cx="480" cy="270" r="180" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.2"/>
  <circle cx="480" cy="270" r="120" fill="none" stroke="#00f0ff" stroke-width="1.2" opacity="0.3"/>
  <circle cx="480" cy="270" r="60" fill="none" stroke="#a855f7" stroke-width="1.5" opacity="0.4"/>

  <!-- Equalizer Bars Spectrum -->
  <g filter="url(#glow)">
    <path d="M120 270 Q 210 140 300 270 T 480 270 T 660 270 T 840 270" fill="none" stroke="url(#waveGrad)" stroke-width="4"/>
    <path d="M120 270 Q 210 380 300 270 T 480 270 T 660 270 T 840 270" fill="none" stroke="#00f0ff" stroke-width="2" opacity="0.5"/>

    <!-- Vertical Spectrum Bars -->
    <rect x="240" y="210" width="8" height="120" rx="4" fill="#00f0ff" opacity="0.8"/>
    <rect x="270" y="170" width="8" height="200" rx="4" fill="#38bdf8" opacity="0.85"/>
    <rect x="300" y="190" width="8" height="160" rx="4" fill="#60a5fa" opacity="0.9"/>
    <rect x="330" y="150" width="8" height="240" rx="4" fill="#3b82f6" opacity="0.95"/>
    <rect x="360" y="130" width="8" height="280" rx="4" fill="url(#waveGrad)"/>
    <rect x="390" y="160" width="8" height="220" rx="4" fill="url(#waveGrad)"/>
    <rect x="420" y="110" width="8" height="320" rx="4" fill="url(#waveGrad)"/>
    <rect x="450" y="90" width="8" height="360" rx="4" fill="url(#waveGrad)"/>
    <rect x="480" y="80" width="8" height="380" rx="4" fill="#00f0ff"/>
    <rect x="510" y="90" width="8" height="360" rx="4" fill="url(#waveGrad)"/>
    <rect x="540" y="110" width="8" height="320" rx="4" fill="url(#waveGrad)"/>
    <rect x="570" y="160" width="8" height="220" rx="4" fill="url(#waveGrad)"/>
    <rect x="600" y="130" width="8" height="280" rx="4" fill="url(#waveGrad)"/>
    <rect x="630" y="150" width="8" height="240" rx="4" fill="#a855f7" opacity="0.95"/>
    <rect x="660" y="190" width="8" height="160" rx="4" fill="#c084fc" opacity="0.9"/>
    <rect x="690" y="170" width="8" height="200" rx="4" fill="#d8b4fe" opacity="0.85"/>
    <rect x="720" y="210" width="8" height="120" rx="4" fill="#e9d5ff" opacity="0.8"/>
  </g>

  <text x="480" y="490" font-family="'Geist Mono', monospace" font-size="12" fill="#94a3b8" text-anchor="middle" letter-spacing="3">FFT FREQUENCY ANALYZER // WEB AUDIO API</text>
</svg>

