<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="DevSpace 3D WebGL Portfolio Preview">
  <rect width="960" height="540" fill="#0b0e14"/>
  <defs>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0b0e14" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow3d" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <circle cx="480" cy="270" r="280" fill="url(#cyanGlow)"/>

  <!-- Holographic Orbits -->
  <ellipse cx="480" cy="270" rx="340" ry="110" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>
  <ellipse cx="480" cy="270" rx="260" ry="85" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>

  <!-- Center 3D Console Panel -->
  <g filter="url(#shadow3d)">
    <rect x="180" y="100" width="600" height="340" rx="20" fill="#151922" stroke="rgba(52, 191, 255, 0.3)" stroke-width="1.5"/>
    <rect x="180" y="100" width="600" height="48" rx="20" fill="#1c2230"/>
    <circle cx="212" cy="124" r="6" fill="#ff5f56"/>
    <circle cx="232" cy="124" r="6" fill="#ffbd2e"/>
    <circle cx="252" cy="124" r="6" fill="#27c93f"/>

    <text x="480" y="130" font-family="'Geist Mono', monospace" font-size="12" fill="#94a3b8" text-anchor="middle">DevSpace // R3F & Three.js Engine</text>

    <!-- Wireframe 3D grid -->
    <path d="M220 380 L380 200 L580 200 L740 380 Z" fill="none" stroke="#00f0ff" stroke-width="1.2" opacity="0.35"/>
    <path d="M300 290 L660 290" stroke="#00f0ff" stroke-width="1" opacity="0.25"/>
    <path d="M480 200 L480 380" stroke="#00f0ff" stroke-width="1" opacity="0.4"/>

    <!-- Floating HUD Elements -->
    <rect x="220" y="180" width="160" height="70" rx="10" fill="rgba(5, 46, 135, 0.4)" stroke="#38bdf8" stroke-width="1"/>
    <text x="236" y="210" font-family="'Geist Mono', monospace" font-size="11" fill="#38bdf8">FPS: 60.0</text>
    <text x="236" y="232" font-family="'Geist Mono', monospace" font-size="10" fill="#94a3b8">Draw calls: 24</text>

    <!-- Floating Code / Geometry Badge -->
    <rect x="580" y="180" width="160" height="70" rx="10" fill="rgba(5, 46, 135, 0.4)" stroke="#00f0ff" stroke-width="1"/>
    <text x="596" y="210" font-family="'Geist Mono', monospace" font-size="11" fill="#00f0ff">Shaders: GLSL</text>
    <text x="596" y="232" font-family="'Geist Mono', monospace" font-size="10" fill="#94a3b8">Lenis: Active</text>
  </g>
</svg>

